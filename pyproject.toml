[project]
name = "project-mcp"
version = "0.2.14"
description = "Project-agnostic MCP server that builds and maintains a compact, local knowledge index of a software repository."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "pyyaml>=6.0",
]

[project.scripts]
project-mcp = "project_mcp.main_stdio:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
