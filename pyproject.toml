[project]
name = "project-mcp"
version = "1.0.1"
description = "Project-agnostic MCP server that builds and maintains a compact, local knowledge index of a software repository."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2",
    "pyyaml>=6.0",
]

[project.scripts]
project-mcp = "project_mcp.main_stdio:main"

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "project-mcp[treesitter]",
    "pytest>=8.0.0",
    "pytest-json-report>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
