name = "project-mcp"
version = "1.3.0"
[runtime]
type = "python"
python = ">=3.12"
[install]
strategy = "uv"
entrypoint = "project-mcp"

# What `mcpctl init project-mcp [project]` copies into a consumer project.
# Only the project-mcp hook scripts are copied (not the whole .agents/ dir):
# the shared safety hooks and the TDD skills belong to outside-in-tdd-mcp.
#
# .mcp.json, .claude/settings.json and .codex/config.toml
# are merged: existing values win and only missing entries are added.
# (Comments in an existing .codex/config.toml are not preserved when merged.)
# Pi's workflow assets and config (.pi/, including the project-mcp entry in
# .pi/mcp.json) are shipped by outside-in-tdd-mcp, not here.
[scaffold]
requires = ["jq"]  # the hooks parse JSON with it; `mcpctl init` warns if it is missing

[[scaffold.files]]
from = ".mcp.json.example"
to = ".mcp.json"
merge = "json"

[[scaffold.files]]
from = ".claude/settings.json.example"
to = ".claude/settings.json"
merge = "json"

[[scaffold.files]]
from = ".codex/config.toml.example"
to = ".codex/config.toml"
merge = "toml"

[[scaffold.files]]
from = ".agents/hooks/project-mcp-consult-gate.sh"
to = ".agents/hooks/project-mcp-consult-gate.sh"

[[scaffold.files]]
from = ".project-mcp/config.toml.example"
to = ".project-mcp/config.toml"

[[scaffold.hints]]
message = "Add .project-mcp/index.db* (the index and its -wal/-shm files) and .project-mcp/state.json to .gitignore (generated index state)."

[[scaffold.hints]]
message = "Restart your client here and run /mcp (Claude Code) to confirm project-mcp is connected."
